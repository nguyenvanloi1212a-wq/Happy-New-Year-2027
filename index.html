<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000005">
<title>🎆 Happy New Year 2026 🎆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:absolute;inset:0}

  #ui{position:absolute;inset:0;pointer-events:none;z-index:10}

  /* ---- Countdown ---- */
  #countdown{position:absolute;top:max(3%,18px);left:50%;transform:translateX(-50%);
    text-align:center;width:100%;padding:0 8px}
  .cd-label{font-size:clamp(10px,2.8vw,14px);letter-spacing:3px;color:#9af;
    text-shadow:0 0 12px #46f;margin-bottom:8px;font-weight:700}
  .cd-time{display:flex;gap:clamp(4px,1.6vw,12px);justify-content:center;flex-wrap:wrap}
  .cd-unit{background:rgba(80,120,255,.08);border:1px solid rgba(120,180,255,.3);
    border-radius:10px;padding:clamp(4px,1.4vw,9px) clamp(6px,2.4vw,14px);
    min-width:clamp(46px,13vw,72px);backdrop-filter:blur(8px);
    box-shadow:0 0 18px rgba(100,150,255,.25)}
  .cd-num{font-size:clamp(20px,6vw,36px);font-weight:800;
    background:linear-gradient(180deg,#fff,#7cf);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;line-height:1}
  .cd-sub{font-size:clamp(8px,1.9vw,10px);color:#68a;letter-spacing:2px;margin-top:3px}

  /* ---- Title ---- */
  #title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:100%;padding:0 10px}
  #title h1{font-size:clamp(22px,7.5vw,62px);font-weight:900;letter-spacing:2px;
    background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#4dff88,#00e0ff,#7b5cff,#ff00e6,#ff004c);
    background-size:400% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;animation:rainbow 4s linear infinite,pulse 2.2s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(255,100,200,.85)) drop-shadow(0 0 28px rgba(100,200,255,.6))}
  #title h2{font-size:clamp(46px,17vw,132px);font-weight:900;margin-top:2px;letter-spacing:6px;
    background:linear-gradient(90deg,#00e0ff,#7b5cff,#ff00e6,#ff004c,#ff8a00,#ffe600,#4dff88,#00e0ff);
    background-size:400% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;animation:rainbow 3s linear infinite reverse,pulse 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 18px rgba(255,255,120,.9)) drop-shadow(0 0 44px rgba(255,100,255,.7))}

  /* ---- Subtitle ---- */
  #subtitle{position:absolute;bottom:11%;width:100%;text-align:center;
    font-size:clamp(13px,4vw,24px);font-weight:800;letter-spacing:3px;
    background:linear-gradient(90deg,#ffe600,#ff8a00,#ff004c,#ff00e6,#7b5cff,#00e0ff,#4dff88,#ffe600);
    background-size:400% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;animation:rainbow 5s linear infinite;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.75))}

  @keyframes rainbow{0%{background-position:0% 50%}100%{background-position:400% 50%}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
  @keyframes fade{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ---- Controls ---- */
  #controls{position:absolute;bottom:max(3%,16px);left:50%;transform:translateX(-50%);
    display:flex;gap:8px;pointer-events:auto;z-index:20;flex-wrap:wrap;justify-content:center;padding:0 8px}
  .btn{background:rgba(100,140,255,.15);border:1px solid rgba(140,180,255,.35);color:#fff;
    padding:9px 14px;border-radius:22px;font-size:12px;font-weight:600;cursor:pointer;
    backdrop-filter:blur(8px);transition:all .2s;white-space:nowrap;
    box-shadow:0 0 16px rgba(80,120,255,.2)}
  .btn:active{transform:scale(.94);background:rgba(140,180,255,.3)}
  .btn.off{opacity:.45;filter:grayscale(.6)}

  #hint{position:absolute;bottom:1%;width:100%;text-align:center;
    color:#557;font-size:11px;animation:fade 3s ease-in-out infinite;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="countdown">
    <div class="cd-label">⏳ ĐẾM NGƯỢC TỚI 2026</div>
    <div class="cd-time">
      <div class="cd-unit"><div class="cd-num" id="cd-d">00</div><div class="cd-sub">NGÀY</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-h">00</div><div class="cd-sub">GIỜ</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-m">00</div><div class="cd-sub">PHÚT</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-s">00</div><div class="cd-sub">GIÂY</div></div>
    </div>
  </div>
  <div id="title">
    <h1>HAPPY NEW YEAR</h1>
    <h2>2026</h2>
  </div>
  <div id="subtitle">✨ CHÚC MỪNG NĂM MỚI ✨</div>
  <div id="controls">
    <button class="btn" id="btn-fw">🎆 Pháo hoa</button>
    <button class="btn off" id="btn-sound">🔇 Âm thanh</button>
    <button class="btn" id="btn-full">⛶ Toàn màn hình</button>
  </div>
  <div id="hint">👆 Chạm vào màn hình để bắn pháo hoa</div>
</div>

<script>
(() => {
'use strict';

// ==================== SETUP ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); initStars(); initSnow(); });
resize();

// ==================== UTILS ====================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => (a + Math.random() * (b - a)) | 0;
const pick = arr => arr[(Math.random() * arr.length) | 0];

let fireworksEnabled = true;
let soundEnabled = false;
let shakeMag = 0;
let flashAlpha = 0;

// ==================== AUDIO ====================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playLaunchSound() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(950, t + 0.9);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.9);
}
function playExplosionSound() {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime;
  const dur = 0.5;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1600;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}

// ==================== STARS ====================
const stars = [];
function initStars() {
  stars.length = 0;
  const count = Math.min(Math.floor((W * H) / 5000), 200);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.85,
      r: rand(0.3, 1.5),
      phase: Math.random() * TAU,
      speed: rand(0.5, 2),
      hue: rand(180, 260),
    });
  }
}
initStars();

function drawStars(t) {
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase);
    ctx.fillStyle = `hsla(${s.hue},80%,85%,${0.3 + tw * 0.7})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.7 + tw * 0.5), 0, TAU);
    ctx.fill();
  }
}

// ==================== SNOW ====================
const snowflakes = [];
function initSnow() {
  snowflakes.length = 0;
  const count = Math.min(Math.floor((W * H) / 7000), 120);
  for (let i = 0; i < count; i++) {
    snowflakes.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(0.8, 2.5),
      vy: rand(0.3, 1.2),
      vx: rand(-0.2, 0.2),
      phase: Math.random() * TAU,
      sw: rand(0.3, 1.0),
    });
  }
}
initSnow();

function updateSnow(dt, t) {
  for (const s of snowflakes) {
    s.y += s.vy * dt;
    s.x += Math.sin(t * 0.001 + s.phase) * s.sw * 0.5 + s.vx * dt;
    if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
    if (s.x < -5) s.x = W + 5;
    if (s.x > W + 5) s.x = -5;
  }
}
function drawSnow() {
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const s of snowflakes) {
    ctx.globalAlpha = 0.3 + s.r / 4;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ==================== CONFETTI ====================
const confettis = [];
const confettiColors = ['#ff004c','#ff8a00','#ffe600','#4dff88','#00e0ff','#7b5cff','#ff00e6','#fff'];
let confettiTimer = 0;

function spawnConfetti() {
  for (let i = 0; i < 4; i++) {
    confettis.push({
      x: Math.random() * W,
      y: -10,
      w: rand(4, 9),
      h: rand(6, 13),
      vy: rand(0.8, 2.5),
      vx: rand(-0.8, 0.8),
      rot: Math.random() * TAU,
      vr: rand(-0.15, 0.15),
      color: pick(confettiColors),
      wave: Math.random() * TAU,
    });
  }
}
function updateConfetti(dt) {
  for (let i = confettis.length - 1; i >= 0; i--) {
    const c = confettis[i];
    c.y += c.vy * dt;
    c.wave += 0.1 * dt;
    c.x += c.vx * dt + Math.sin(c.wave) * 0.5;
    c.rot += c.vr * dt;
    if (c.y > H + 20) confettis.splice(i, 1);
  }
}
function drawConfetti() {
  for (const c of confettis) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h * Math.abs(Math.cos(c.rot * 2)));
    ctx.restore();
  }
}

// ==================== FIREWORKS ====================
const rockets = [];
const particles = [];

class Rocket {
  constructor(x, targetY, opts = {}) {
    this.x = x;
    this.y = opts.fromY !== undefined ? opts.fromY : H + 10;
    this.targetY = targetY;
    this.vx = opts.vx !== undefined ? opts.vx : rand(-0.4, 0.4);
    this.vy = -rand(9, 13);
    this.hue = opts.hue !== undefined ? opts.hue : rand(0, 360);
    this.trail = [];
    this.type = opts.type || pick([
      'peony','peony','willow','ring','heart','star',
      'chrysanthemum','crossette','palm'
    ]);
    this.trailLen = (this.type === 'willow' || this.type === 'palm') ? 14 : 7;
  }
  update(dt) {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.trailLen) this.trail.shift();
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += 0.15 * dt;
    if (this.vy >= 0 || this.y <= this.targetY) {
      explode(this.x, this.y, this.hue, this.type);
      return false;
    }
    return true;
  }
  draw() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (i / this.trail.length) * 0.75;
      ctx.fillStyle = `hsla(${this.hue},100%,72%,${a})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 1.6, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = `hsl(${this.hue},100%,88%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.6, 0, TAU);
    ctx.fill();
  }
}

function addParticle(x, y, vx, vy, hue, opts = {}) {
  particles.push({
    x, y, vx, vy,
    hue,
    life: 1,
    decay: opts.decay || rand(0.008, 0.018),
    size: opts.size || rand(1.2, 2.5),
    gravity: opts.gravity !== undefined ? opts.gravity : 0.08,
    drag: opts.drag !== undefined ? opts.drag : 0.985,
    trail: opts.trail || 0,
    willSplit: opts.willSplit || false,
    splitLife: opts.splitLife || 0.55,
    didSplit: false,
    prevX: x,
    prevY: y,
  });
}

function explode(x, y, baseHue, type) {
  flashAlpha = Math.min(flashAlpha + 0.22, 0.55);
  shakeMag = Math.min(shakeMag + 5, 11);
  playExplosionSound();

  const palettes = [
    { base: 0, range: 30 },
    { base: 40, range: 30 },
    { base: 120, range: 40 },
    { base: 190, range: 40 },
    { base: 260, range: 40 },
    { base: 320, range: 40 },
  ];
  const pal = pick(palettes);
  const hue = rand(pal.base, pal.base + pal.range);
  const count = type === 'palm' ? 45 : type === 'willow' ? 80 : randInt(80, 125);

  switch (type) {
    case 'peony': {
      for (let i = 0; i < count; i++) {
        const a = (TAU * i) / count + rand(-0.1, 0.1);
        const s = rand(2, 7);
        addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, hue + rand(-15, 15));
      }
      break;
    }
    case 'willow': {
      for (let i = 0; i < count; i++) {
        const a = rand(0, TAU);
        const s = rand(1, 4.5);
        addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, hue + rand(-20, 20), {
          gravity: 0.12, decay: rand(0.004, 0.008), size: rand(1, 2), trail: 4,
        });
      }
      break;
    }
    case 'ring': {
      const tilt = rand(0.35, 1);
      for (let i = 0; i < count; i++) {
        const a = (TAU * i) / count;
        addParticle(x, y, Math.cos(a) * 5, Math.sin(a) * 5 * tilt, hue + rand(-10, 10), {
          decay: rand(0.008, 0.015),
        });
      }
      break;
    }
    case 'heart': {
      for (let i = 0; i < count; i++) {
        const t = (TAU * i) / count;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        addParticle(x, y, hx * 0.33 + rand(-0.3, 0.3), hy * 0.33 + rand(-0.3, 0.3),
          340 + rand(-20, 20), { decay: rand(0.008, 0.014), gravity: 0.03 });
      }
      break;
    }
    case 'star': {
      for (let i = 0; i < count; i++) {
        const t = (TAU * i) / count;
        const r = 4 + 2 * Math.cos(5 * t);
        addParticle(x, y, Math.cos(t) * r, Math.sin(t) * r, hue + rand(-15, 15));
      }
      break;
    }
    case 'chrysanthemum': {
      for (let i = 0; i < count; i++) {
        const a = rand(0, TAU);
        const s = rand(0.5, 6);
        addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, hue + rand(-20, 20), {
          trail: 3, decay: rand(0.006, 0.012),
        });
      }
      break;
    }
    case 'palm': {
      const branches = 12;
      for (let b = 0; b < branches; b++) {
        const a = (TAU * b) / branches + rand(-0.1, 0.1);
        for (let i = 0; i < 6; i++) {
          const s = rand(2, 5.5);
          addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, hue + rand(-10, 10), {
            gravity: 0.1, trail: 4, decay: rand(0.005, 0.01), size: rand(1.5, 3),
          });
        }
      }
      break;
    }
    case 'crossette': {
      const n = 18;
      for (let i = 0; i < n; i++) {
        const a = (TAU * i) / n;
        addParticle(x, y, Math.cos(a) * 4, Math.sin(a) * 4, hue + rand(-10, 10), {
          decay: 0.010, size: 2.6, willSplit: true, splitLife: 0.55,
        });
      }
      break;
    }
  }

  particles.push({
    x, y, vx: 0, vy: 0, hue,
    life: 1, decay: 0.09, size: 55, flash: true,
    gravity: 0, drag: 1, prevX: x, prevY: y,
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.prevX = p.x;
    p.prevY = p.y;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.vx *= Math.pow(p.drag, dt);
    p.vy *= Math.pow(p.drag, dt);
    p.life -= p.decay * dt;

    if (p.willSplit && !p.didSplit && p.life < p.splitLife) {
      p.didSplit = true;
      const baseAngle = Math.atan2(p.vy, p.vx);
      for (let j = 0; j < 4; j++) {
        const a = (TAU * j) / 4 + baseAngle;
        addParticle(p.x, p.y, Math.cos(a) * 3.6, Math.sin(a) * 3.6,
          p.hue + rand(-25, 25), { decay: 0.020, size: 1.9 });
      }
    }

    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    if (p.flash) {
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      grad.addColorStop(0, `hsla(${p.hue},100%,92%,${p.life * 0.85})`);
      grad.addColorStop(1, `hsla(${p.hue},100%,60%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    } else if (p.trail > 0) {
      const alpha = Math.max(0, p.life);
      ctx.strokeStyle = `hsla(${p.hue},100%,72%,${alpha * 0.75})`;
      ctx.lineWidth = p.size * alpha;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.prevX, p.prevY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      const alpha = Math.max(0, p.life);
      ctx.fillStyle = `hsla(${p.hue},100%,${55 + alpha * 35}%,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ==================== COUNTDOWN ====================
const elD = document.getElementById('cd-d');
const elH = document.getElementById('cd-h');
const elM = document.getElementById('cd-m');
const elS = document.getElementById('cd-s');
const elLabel = document.querySelector('.cd-label');
const TARGET = new Date(2026, 0, 1, 0, 0, 0).getTime();
let newYearTriggered = false;

function celebrateNewYear() {
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const x = rand(W * 0.1, W * 0.9);
      const y = rand(H * 0.08, H * 0.5);
      const type = pick(['peony','willow','ring','heart','star','chrysanthemum','crossette','palm']);
      explode(x, y, 0, type);
    }, i * 100);
  }
  shakeMag = 15;
  flashAlpha = 0.8;
}

function updateCountdown() {
  const diff = TARGET - Date.now();
  if (diff <= 0) {
    elLabel.textContent = '🎉 CHÚC MỪNG NĂM MỚI 2026 🎉';
    elD.textContent = elH.textContent = elM.textContent = elS.textContent = '00';
    if (!newYearTriggered) {
      newYearTriggered = true;
      celebrateNewYear();
    }
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  elD.textContent = String(d).padStart(2, '0');
  elH.textContent = String(h).padStart(2, '0');
  elM.textContent = String(m).padStart(2, '0');
  elS.textContent = String(s).padStart(2, '0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

// ==================== SPAWN ====================
let spawnTimer = 0;
let burstTimer = 0;

function spawnRandom() {
  if (!fireworksEnabled) return;
  rockets.push(new Rocket(rand(W * 0.1, W * 0.9), rand(H * 0.08, H * 0.45)));
  playLaunchSound();
}
function bigBurst() {
  if (!fireworksEnabled) return;
  const n = 3 + randInt(0, 3);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      rockets.push(new Rocket(rand(W * 0.12, W * 0.88), rand(H * 0.08, H * 0.5)));
      playLaunchSound();
    }, i * 130);
  }
}

// ==================== MAIN LOOP ====================
let lastT = performance.now();

function loop(now) {
  const dt = Math.min((now - lastT) / 16.67, 3);
  lastT = now;

  // Fade trail
  ctx.fillStyle = 'rgba(0,0,8,0.18)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shakeMag > 0.1) {
    ctx.translate(rand(-shakeMag, shakeMag), rand(-shakeMag, shakeMag));
    shakeMag *= 0.88;
  }

  drawStars(now);

  // Spawn auto
  if (fireworksEnabled) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnRandom(); spawnTimer = rand(25, 60); }
    burstTimer -= dt;
    if (burstTimer <= 0) { bigBurst(); burstTimer = rand(180, 360); }
  }
  confettiTimer -= dt;
  if (confettiTimer <= 0) { spawnConfetti(); confettiTimer = rand(3, 8); }

  // Update
  for (let i = rockets.length - 1; i >= 0; i--) {
    if (!rockets[i].update(dt)) rockets.splice(i, 1);
    else rockets[i].draw();
  }
  updateParticles(dt);
  updateSnow(dt, now);
  updateConfetti(dt);

  // Draw
  drawParticles();
  drawConfetti();
  drawSnow();

  ctx.restore();

  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    flashAlpha *= 0.85;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== INTERACTION ====================
function shootAt(x, y) {
  if (!fireworksEnabled) return;
  const type = pick(['peony','willow','ring','heart','star','chrysanthemum','crossette','palm']);
  rockets.push(new Rocket(x, y, { type }));
  playLaunchSound();
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) shootAt(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('mousedown', (e) => shootAt(e.clientX, e.clientY));

// ==================== CONTROLS ====================
document.getElementById('btn-fw').addEventListener('click', (e) => {
  fireworksEnabled = !fireworksEnabled;
  e.target.classList.toggle('off', !fireworksEnabled);
});
document.getElementById('btn-sound').addEventListener('click', (e) => {
  soundEnabled = !soundEnabled;
  if (soundEnabled) initAudio();
  e.target.classList.toggle('off', !soundEnabled);
  e.target.textContent = soundEnabled ? '🔊 Âm thanh' : '🔇 Âm thanh';
});
document.getElementById('btn-full').addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
  }
});

// Prevent zoom on double-tap
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

})();
</script>
