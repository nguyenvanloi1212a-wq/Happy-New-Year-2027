<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<meta name="description" content="Trang chúc mừng Giáng sinh 2026, Năm mới 2027 và Tết Đinh Mùi với đếm ngược, pháo hoa, âm thanh và lời chúc chung.">
<title>Happy New Year 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-a:#2b1a3d;
  --sky-b:#0b0614;
  --ink:#fff4e2;
  --muted:#d6c2c8;
  --gold:#ffd27a;
  --gold-2:#ffb347;
  --rose:#ff7a9a;
  --panel:rgba(28,16,34,.82);
  --panel-soft:rgba(28,16,34,.6);
  --line:rgba(255,210,122,.3);
  --line-strong:rgba(255,210,122,.55);
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --tabs-h:92px;
  --bar-h:152px;
  --ui:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --script:'Mountains of Christmas',Georgia,serif;
  color-scheme:dark
}
:root[data-scene="ny"]{--sky-a:#3d1c16;--sky-b:#0a0609}
:root[data-scene="tet"]{--sky-a:#5e1218;--sky-b:#130508;--gold:#ffd977;--line:rgba(255,200,90,.36);--line-strong:rgba(255,200,90,.6)}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{
  width:100%;height:100%;min-height:100%;
  overflow:hidden;
  color:var(--ink);
  font-family:var(--ui);
  touch-action:manipulation;
  background:var(--sky-b);
}
body{
  min-height:100svh;
  background:
    radial-gradient(ellipse at 50% 115%,var(--sky-a),var(--sky-b) 62%),
    radial-gradient(ellipse at 18% 18%,rgba(255,210,122,.05),transparent 45%),
    radial-gradient(ellipse at 82% 72%,rgba(255,122,154,.04),transparent 45%);
}
button,textarea{font:inherit}
button{
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 14px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
}
button:active{transform:translateY(0)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button[aria-pressed="true"]{
  background:rgba(255,210,122,.18);
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,210,122,.1), 0 4px 18px rgba(255,180,80,.15);
}

#fx{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;pointer-events:none;
}

/* ===== Tabs ===== */
.tabs{
  position:absolute;top:0;left:0;right:0;
  z-index:10;
  display:flex;flex-wrap:wrap;justify-content:center;gap:7px;
  padding:max(12px,env(safe-area-inset-top)) var(--gr) 10px var(--gl);
}
.tabs button{
  background:rgba(20,12,24,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);
  padding:10px 16px;
  font-size:12px;
  letter-spacing:.3px;
  color:rgba(255,244,226,.85);
}
.tabs button[aria-pressed="true"]{
  background:linear-gradient(135deg,rgba(255,210,122,.25),rgba(255,122,154,.14));
  border-color:rgba(255,210,122,.7);
  color:#ffe9b0;
  box-shadow:0 0 22px rgba(255,210,122,.22), inset 0 0 14px rgba(255,210,122,.08);
}

/* ===== Scene ===== */
.scene{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--tabs-h) + 8px) var(--gr) calc(var(--bar-h) + 8px) var(--gl);
  opacity:0;visibility:hidden;pointer-events:none;
  overflow-y:auto;overscroll-behavior:contain;
  transition:opacity .7s cubic-bezier(.4,0,.2,1),visibility .7s;
}
.scene.is-active{opacity:1;visibility:visible;pointer-events:auto}

.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);
  padding:7px 16px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,210,122,.05);
  box-shadow:inset 0 0 20px rgba(255,210,122,.05);
}
.eyebrow::before,.eyebrow::after{
  content:'';width:14px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));
}
.eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent)}

.script{
  font:700 clamp(48px,14vw,92px)/1.08 var(--script);
  margin-top:10px;
  background:linear-gradient(90deg,#ffe9b0 0%,#ffd27a 22%,#ff9a8a 50%,#ffd27a 78%,#ffe9b0 100%);
  background-size:200% 100%;
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,190,110,.45));
  animation:shimmer 6s ease-in-out infinite;
}
@keyframes shimmer{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

.year{
  font:700 clamp(100px,34vw,205px)/.98 var(--serif);
  letter-spacing:2px;
  background:linear-gradient(100deg,#ffd27a 0%,#ff9a5a 30%,#ff7a9a 50%,#ff9a5a 70%,#ffd27a 100%);
  background-size:200% 100%;
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,150,90,.4));
  animation:shimmer 5s ease-in-out infinite;
}

.tet-title{
  font:700 clamp(46px,12vw,88px)/1.05 var(--serif);
  margin-top:10px;
  background:linear-gradient(100deg,#ffe9a8 0%,#ffc857 30%,#ff7a5a 55%,#ffc857 80%,#ffe9a8 100%);
  background-size:200% 100%;
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,150,80,.35));
  animation:shimmer 5s ease-in-out infinite;
}

.lede,.verse{
  max-width:31ch;margin-top:14px;
  font:500 clamp(18px,4.8vw,22px)/1.45 var(--serif);
  color:var(--muted);
  text-wrap:balance;
}
.verse{
  font-size:clamp(15px,4vw,18px);font-style:italic;color:var(--gold);
  opacity:.9;
}

.tree{
  width:clamp(95px,25vw,135px);height:auto;margin-bottom:10px;
  filter:drop-shadow(0 0 18px rgba(255,210,122,.4));
  animation:treeGlow 4s ease-in-out infinite;
}
@keyframes treeGlow{
  0%,100%{filter:drop-shadow(0 0 18px rgba(255,210,122,.4))}
  50%{filter:drop-shadow(0 0 30px rgba(255,210,122,.7))}
}

.ghost{
  margin-top:18px;
  background:none;border:0;
  color:var(--muted);font-size:13px;font-weight:600;
  padding:8px 16px;position:relative;
  opacity:.85;transition:color .2s ease,opacity .2s ease;
}
.ghost::after{
  content:'';position:absolute;left:16px;right:16px;bottom:5px;height:1px;
  background:currentColor;opacity:.35;transition:opacity .2s ease;
}

/* ===== Countdown ===== */
.countdown{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
  width:min(100%,360px);margin-top:24px;
}
.countdown>div{
  position:relative;
  padding:12px 4px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(40,22,48,.92),rgba(18,9,24,.92));
  box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
  transition:border-color .25s ease,box-shadow .25s ease;
}
.countdown>div::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,210,122,.08),transparent 60%);
  pointer-events:none;
}
.countdown>div::after{
  content:'';position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.55;
}
.countdown span{
  display:block;
  font:700 clamp(25px,7vw,36px)/1.2 var(--serif);
  font-variant-numeric:tabular-nums;
  color:var(--gold);
  text-shadow:0 0 18px rgba(255,210,122,.35);
}
.countdown small{
  font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  font-weight:600;
}
.cd-note{
  margin-top:12px;font-size:12px;color:var(--muted);max-width:34ch;
  opacity:.8;
}

/* ===== Envelope ===== */
.envelope{
  position:relative;isolation:isolate;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  margin-top:20px;
  width:min(72vw,250px);height:145px;
  border-radius:16px;
  border:1px solid #f2c46d;
  background:
    repeating-linear-gradient(45deg,rgba(255,210,122,.05) 0,rgba(255,210,122,.05) 6px,transparent 6px,transparent 14px),
    radial-gradient(ellipse at 50% 0%,#e04a4f,#b82228 45%,#7a0f16);
  color:#ffe29a;
  box-shadow:
    0 14px 34px rgba(0,0,0,.45),
    inset 0 0 0 4px rgba(255,210,122,.14),
    0 0 30px rgba(255,210,122,.18);
  overflow:hidden;
  transition:transform .3s ease,box-shadow .3s ease;
}
.envelope:active{transform:translateY(-1px)}
.flap{
  position:absolute;left:0;right:0;top:0;height:52%;
  background:linear-gradient(#a51d24,#8a1319);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;z-index:0;
}
.env-top,.seal,.env-label{position:relative;z-index:1}
.env-top{
  font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,226,154,.85);
}
.seal{
  width:50px;height:50px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff0bd,#e9b24f 55%,#b97a1f);
  box-shadow:0 0 20px rgba(255,210,122,.65), inset 0 -2px 6px rgba(120,60,10,.35);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
}
.seal svg{width:24px;height:24px}
.env-label{font-size:15px;font-weight:800;letter-spacing:.5px}
.envelope.is-open .flap{animation:flapOpen .7s ease both}
.envelope.is-open .seal{transform:translateY(-9px) scale(1.15)}
@keyframes flapOpen{to{transform:rotateX(-165deg)}}

.blessing{
  display:block;
  margin-top:16px;
  padding:16px 20px;
  max-width:32ch;min-height:3.5em;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(180deg,rgba(40,22,48,.9),rgba(18,9,24,.9));
  box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  font:600 italic clamp(18px,5vw,23px)/1.4 var(--serif);
  color:var(--gold);
  position:relative;
}
.lt-ref{
  display:block;margin-top:8px;
  font:600 11px var(--ui);letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);opacity:.85;
}

/* ===== Bottom bar ===== */
.bar{
  position:absolute;left:0;right:0;bottom:0;z-index:12;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
  padding:26px var(--gr) max(14px,env(safe-area-inset-bottom)) var(--gl);
  background:linear-gradient(to top,rgba(7,5,11,.97) 22%,rgba(7,5,11,.72) 60%,transparent);
}
.bar button{
  font-size:12px;padding:9px 12px;
  background:rgba(28,16,34,.72);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

/* ===== Sheet ===== */
.sheet{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(7,5,11,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding-top:env(safe-area-inset-top);
  animation:sheetIn .3s ease;
}
@keyframes sheetIn{from{opacity:0}to{opacity:1}}
.sheet-card{
  width:100%;max-width:540px;
  max-height:88%;max-height:88dvh;
  overflow-y:auto;overscroll-behavior:contain;
  padding:20px max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#241428,#180d1c);
  border:1px solid var(--line);
  border-radius:22px 22px 0 0;
  box-shadow:0 -12px 44px rgba(0,0,0,.55);
  animation:sheetUp .45s cubic-bezier(.2,.9,.25,1);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head,.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head{margin-bottom:14px}
.sheet-head h2{font:700 24px var(--serif);color:var(--gold)}
label{display:block;margin-bottom:7px;font-size:13px;color:var(--muted)}
textarea{
  display:block;width:100%;min-height:88px;resize:vertical;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(7,5,11,.6);
  color:var(--ink);font-size:16px;line-height:1.4;
  transition:border-color .2s ease;
}
textarea:focus{border-color:var(--line-strong)}
.form-row{margin-top:10px}
.form-row span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.primary{
  background:linear-gradient(135deg,#ffd27a,#ffb347);
  color:#2a1426;border-color:transparent;font-weight:800;
  box-shadow:0 4px 18px rgba(255,180,80,.3);
}
.primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

.mini{padding:6px 11px;font-size:12px;flex:none}

.wish-list{
  list-style:none;display:grid;gap:8px;margin-top:16px;
  max-height:28vh;overflow:auto;
}
.wish-list li{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(135deg,rgba(255,210,122,.06),rgba(255,210,122,.015));
  text-align:left;font-size:14px;line-height:1.4;
  transition:border-color .2s ease,background .2s ease;
}
.wish-list li span{min-width:0;overflow-wrap:anywhere}
.wish-list li.empty{
  display:block;text-align:center;color:var(--muted);
  background:none;border-style:dashed;
}

.wish-float{
  position:absolute;bottom:30%;z-index:15;pointer-events:none;
  transform:translateX(-50%);
  max-width:min(78vw,300px);
  padding:12px 16px;
  border:1px solid var(--line-strong);
  border-radius:16px;
  background:linear-gradient(180deg,rgba(40,22,48,.96),rgba(18,9,24,.96));
  box-shadow:0 10px 32px rgba(0,0,0,.5),0 0 24px rgba(255,210,122,.15);
  font:600 18px/1.35 var(--serif);
  text-align:center;overflow-wrap:anywhere;
  animation:wishRise 7s ease-out forwards;
}
@keyframes wishRise{
  0%{opacity:0;transform:translate(-50%,24px)}
  12%,80%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-160px)}
}

.toast{
  position:absolute;top:calc(var(--tabs-h) + 8px);left:50%;z-index:40;
  transform:translate(-50%,-8px);
  max-width:88vw;padding:10px 18px;
  border:1px solid var(--line);border-radius:999px;
  background:rgba(28,16,34,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:12px;font-weight:600;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s cubic-bezier(.2,.8,.2,1);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/*
